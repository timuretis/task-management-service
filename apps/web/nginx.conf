# Serves the built React app. Replaces the image's default server block.
server {
    # Unprivileged port: the container runs as a non-root user, which cannot bind below 1024.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Do not reveal the nginx version in headers and error pages.
    server_tokens off;
    # Declared once here. Locations below use `expires`, not `add_header`, because any
    # `add_header` in a location would silently drop these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Vite puts a content hash in asset file names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html names the current asset files, so browsers must always check for a new one.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
