# CI (D25): proves every pull request and every update of main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the jobs only read the code.
permissions:
  contents: read

# A newer push to the same PR cancels the run that is still going. Runs on main are never
# cancelled, so every merge gets a complete result (phase 5 deploys from them).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A real database, so the opt-in real-Postgres suite runs on every change (D21).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: tasks
          # The suite drops its schema, so it only accepts a database named *_test.
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasks -d tasks_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tasks:tasks@localhost:5432/tasks_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # verify.sh checks the Node major version against the same file.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Also runs terraform fmt and validate (through Docker, which the runner has).
      - run: bash scripts/verify.sh

  docker:
    name: Images and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The production files are checked here, without starting anything (D34). Dummy values only.
      - name: Check the production compose file
        run: POSTGRES_PASSWORD=ci IMAGE_TAG=ci docker compose -f compose.prod.yml config --quiet
      - name: Check the Caddyfile
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile
      # Builds both images and waits until every service is healthy (migrate must exit 0).
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 120
      - name: Smoke test
        run: bash scripts/smoke-test.sh
      # Logs from every service make a failed run explainable without rerunning it.
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Runs only on a push to main, after everything above passed (D34). Pull requests skip it.
  deploy:
    name: Deploy to AWS
    needs: [verify, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only this job may write packages and ask GitHub for an OIDC token (D29, D30).
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_PREFIX: ghcr.io/timuretis/task-management-
      AWS_REGION: eu-central-1
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # Images are tagged with the exact commit that passed the tests above.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the images
        run: |
          docker build -f apps/api/Dockerfile -t "${IMAGE_PREFIX}api:$SHA" .
          # The browser calls the API at this URL, which is baked into the JavaScript (D22).
          docker build -f apps/web/Dockerfile --build-arg "VITE_API_URL=https://${{ vars.API_DOMAIN }}" \
            -t "${IMAGE_PREFIX}web:$SHA" .
          docker push "${IMAGE_PREFIX}api:$SHA"
          docker push "${IMAGE_PREFIX}web:$SHA"

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The instance moves its checkout to this commit, pulls the images and restarts what changed (D33).
      - name: Deploy through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters "commands=[\"git -C /opt/app fetch --quiet origin main && git -C /opt/app checkout --quiet --detach $SHA && bash /opt/app/scripts/deploy.sh $SHA\"]" \
            --query Command.CommandId --output text)
          # Fails the job if the command fails or times out; the output below says why.
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_INSTANCE_ID }}" || status=$?
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output yaml
          exit "${status:-0}"

      # Read-only: it never creates a task in production. Retries because a first deploy waits for certificates.
      - name: Smoke test production
        run: |
          for attempt in 1 2 3 4 5 6; do
            API_URL="https://${{ vars.API_DOMAIN }}" WEB_URL="https://${{ vars.WEB_DOMAIN }}" \
              bash scripts/smoke-test.sh --read-only && exit 0
            echo "attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          exit 1
